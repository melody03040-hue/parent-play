<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天做什麼｜親子遊戲小站</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --ink:#665753;
  --soft:#97857f;
  --line:#eaded9;
  --pink:#f7dfe6;
  --yellow:#fff0c8;
  --green:#e4f1df;
  --blue:#e9f0fb;
  --purple:#eee8fb;
  --shadow:0 16px 42px rgba(105,82,74,.10);
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 8%, #fff0f3 0 10%, transparent 30%),
    radial-gradient(circle at 92% 15%, #f1edff 0 10%, transparent 30%),
    #fffaf7;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,250,247,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.nav{
  width:min(1080px,calc(100% - 28px));
  margin:auto;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.brand-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:white;
  border-radius:15px;
  border:1px solid var(--line);
  font-size:22px;
}

.home-link{
  text-decoration:none;
  color:#806f69;
  font-weight:800;
  font-size:14px;
  background:white;
  border:1px solid var(--line);
  padding:9px 14px;
  border-radius:999px;
}

.container{
  width:min(1080px,calc(100% - 28px));
  margin:auto;
  padding:30px 0 50px;
}

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:34px;
  padding:32px;
  background:linear-gradient(145deg,#fff,#fff7f5);
  box-shadow:var(--shadow);
}

.hero::after{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  right:-70px;
  bottom:-110px;
  border-radius:50%;
  background:#eee8fb;
}

.hero-inner{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.hero h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
}

.hero p{
  margin:10px 0 0;
  line-height:1.8;
  color:var(--soft);
}

.hero-art{
  font-size:72px;
}

.category-row{
  margin-top:18px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.category-btn{
  border:1px solid var(--line);
  background:white;
  color:#806f69;
  border-radius:999px;
  padding:10px 15px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}

.category-btn.active{
  background:#806d68;
  color:white;
  border-color:#806d68;
}

.main-grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:18px;
}

.panel{
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:30px;
  padding:24px;
  box-shadow:var(--shadow);
}

.draw-card{
  min-height:390px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  border:1px solid #eaded9;
  border-radius:28px;
  background:
    linear-gradient(145deg,#fffdfb,#fff7f4);
  position:relative;
  overflow:hidden;
  padding:30px;
}

.draw-card::before{
  content:"✦";
  position:absolute;
  top:20px;
  left:24px;
  color:#d8bb80;
  font-size:20px;
}

.draw-card::after{
  content:"♡";
  position:absolute;
  right:24px;
  bottom:18px;
  color:#d79aa8;
  font-size:22px;
}

.activity-icon{
  font-size:72px;
  margin-bottom:14px;
}

.activity-category{
  font-size:13px;
  color:#9a8781;
  font-weight:800;
  margin-bottom:8px;
}

.activity-title{
  font-size:clamp(28px,4vw,42px);
  font-weight:900;
  line-height:1.45;
  margin-bottom:10px;
}

.activity-desc{
  color:#9a8781;
  line-height:1.8;
  max-width:520px;
}

.action-row{
  margin-top:20px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.draw-btn,
.fav-btn{
  border:0;
  border-radius:16px;
  padding:13px 18px;
  font-weight:900;
  font-size:15px;
  cursor:pointer;
}

.draw-btn{
  background:#806d68;
  color:white;
}

.fav-btn{
  background:#fff0c8;
  color:#806d68;
}

.side-title{
  margin:0 0 14px;
  font-size:22px;
}

.favorite-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.favorite-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border:1px solid #ebdfdb;
  background:#fffdfc;
  border-radius:17px;
  padding:12px 13px;
}

.favorite-text{
  font-weight:800;
  line-height:1.5;
}

.remove-btn{
  border:0;
  background:#f6ebe7;
  color:#8a746d;
  border-radius:11px;
  padding:7px 9px;
  cursor:pointer;
}

.empty{
  text-align:center;
  color:#a08e88;
  padding:36px 12px;
  border:1px dashed #e6d8d3;
  border-radius:20px;
}

.empty-icon{
  font-size:38px;
  margin-bottom:8px;
}

.tip{
  margin-top:18px;
  background:#fff8eb;
  border-radius:18px;
  padding:14px;
  color:#8f775f;
  line-height:1.7;
  font-size:13px;
}

.footer{
  text-align:center;
  color:#a08f89;
  font-size:13px;
  padding:28px 0 8px;
}

@media(max-width:760px){
  .main-grid{
    grid-template-columns:1fr;
  }

  .hero-art{
    font-size:56px;
  }
}

@media(max-width:520px){
  .container{
    width:calc(100% - 16px);
    padding-top:16px;
  }

  .hero{
    padding:23px 19px;
  }

  .hero-art{
    display:none;
  }

  .panel{
    padding:17px;
  }

  .draw-card{
    min-height:330px;
    padding:22px 16px;
  }
}
  /* ===== 今天做什麼 Hero・精緻奶油手帳版 ===== */

.hero{
  position:relative;
  overflow:hidden;
  padding:38px 42px;
  border-radius:34px;

  background:
    radial-gradient(circle at 12% 18%,rgba(255,220,228,.52),transparent 24%),
    radial-gradient(circle at 88% 80%,rgba(231,220,249,.60),transparent 26%),
    linear-gradient(135deg,#fffaf7,#fff3e7,#f7effc);
}

.hero::before{
  content:"";
  position:absolute;
  width:170px;
  height:170px;
  left:-55px;
  bottom:-75px;
  border-radius:50%;
  background:rgba(255,255,255,.45);
}

.hero::after{
  content:"✦  ♡  ✦";
  position:absolute;
  right:30px;
  top:18px;
  color:#d8ae70;
  font-size:15px;
  letter-spacing:8px;
  opacity:.65;
}

.hero-inner{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
}

.hero-copy{
  flex:1;
}

.hero-kicker{
  margin-bottom:8px;
  color:#c69aa2;
  font-size:11px;
  font-weight:900;
  letter-spacing:2.5px;
}

.hero h1{
  margin:0;
  color:#765d5a;
  font-size:34px;
  line-height:1.45;
}

.hero-highlight{
  position:relative;
  display:inline-block;
  margin-left:5px;
  padding:0 9px 3px;
  color:#8a6664;
  z-index:1;
}

.hero-highlight::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:2px;
  height:52%;
  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      #f9dfe5,
      #fff0d4,
      #eee5fa
    );

  transform:rotate(-1deg);
  z-index:-1;
}

.hero p{
  margin:12px 0 0;
  color:#957975;
  line-height:1.8;
}

.hero-stickers{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.hero-stickers span{
  padding:7px 12px;
  border-radius:999px;

  background:rgba(255,255,255,.72);
  border:1px solid rgba(224,196,192,.55);

  color:#8d7470;
  font-size:12px;
  font-weight:800;

  box-shadow:0 4px 10px rgba(112,83,78,.05);
}

.hero-art{
  flex:0 0 auto;
  min-width:190px;
  text-align:center;
  font-size:72px;

  filter:
    drop-shadow(0 10px 12px rgba(114,85,80,.10));
}

/* 手機版 */
@media(max-width:650px){

  .hero{
    padding:30px 22px;
  }

  .hero-inner{
    flex-direction:column;
    text-align:center;
  }

  .hero h1{
    font-size:28px;
  }

  .hero-stickers{
    justify-content:center;
  }

  .hero-art{
    font-size:64px;
  }
}
 /* ===== 今天做什麼 Hero 圖片 ===== */

.activities-hero-image{
  display:block;
  width:320px;
  max-width:100%;
  height:auto;
  object-fit:contain;
  border-radius:24px;
  filter:drop-shadow(0 12px 18px rgba(112,83,78,.10));
}

@media(max-width:650px){
  .activities-hero-image{
    width:280px;
  }
} 
 /* ===== 第二區・活動分類按鈕 精緻奶油手帳版 ===== */

.category-row{
  position:relative;
  margin-top:22px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  padding:8px 0;
}

.category-btn{
  position:relative;
  min-width:82px;
  padding:10px 16px;

  border:1px solid rgba(232,211,205,.85);
  border-radius:999px;

  background:linear-gradient(135deg,#fffdfb,#fff7f5);
  color:#8a716d;

  font-family:inherit;
  font-size:13px;
  font-weight:900;

  cursor:pointer;

  box-shadow:0 5px 12px rgba(103,79,72,.045);
  transition:.18s ease;
}

.category-btn:hover{
  transform:translateY(-2px);
  border-color:#e5c9ce;

  background:
    linear-gradient(135deg,#fff5f6,#faf1ff);

  box-shadow:0 7px 16px rgba(103,79,72,.07);
}

/* 被選中的分類 */
.category-btn.active{
  border-color:#e0b5bf;

  background:
    linear-gradient(
      135deg,
      #f6dce3,
      #f9e6d8,
      #e9dff6
    );

  color:#80645f;

  box-shadow:
    0 6px 16px rgba(196,151,168,.15),
    inset 0 0 0 2px rgba(255,255,255,.38);
}

/* 選中時的小星星 */
.category-btn.active::before{
  content:"✦";
  margin-right:5px;
  color:#c79f59;
  font-size:10px;
}

/* 手機版 */
@media(max-width:600px){

  .category-row{
    gap:7px;
  }

  .category-btn{
    min-width:auto;
    padding:9px 13px;
    font-size:12px;
  }
} 
  /* ===== 第三區・抽活動結果卡片 精緻奶油手帳版 ===== */

.draw-card{
  position:relative;
  overflow:hidden;
  min-height:390px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  padding:34px 28px;
  text-align:center;

  border:1px solid rgba(232,213,207,.85);
  border-radius:28px;

  background:
    radial-gradient(circle at 12% 15%,rgba(255,224,232,.48),transparent 24%),
    radial-gradient(circle at 88% 82%,rgba(233,224,249,.52),transparent 26%),
    linear-gradient(145deg,#fffdfb,#fff7f3);

  box-shadow:
    inset 0 0 0 4px rgba(255,255,255,.55),
    0 10px 26px rgba(103,79,72,.055);
}

.draw-card::before{
  content:"✦  ♡";
  position:absolute;
  top:18px;
  left:22px;

  color:#d3ab69;
  font-size:14px;
  letter-spacing:6px;
  opacity:.6;
}

.draw-card::after{
  content:"🎀";
  position:absolute;
  right:22px;
  bottom:18px;

  font-size:22px;
  opacity:.35;
}

.activity-icon{
  width:86px;
  height:86px;

  display:grid;
  place-items:center;

  margin-bottom:16px;

  border-radius:28px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(231,211,203,.68);

  font-size:48px;

  box-shadow:
    0 8px 18px rgba(105,82,74,.06),
    inset 0 0 0 3px rgba(255,249,247,.7);
}

.activity-category{
  display:inline-block;

  margin-bottom:9px;
  padding:5px 11px;

  border-radius:999px;

  background:linear-gradient(135deg,#fff2e4,#f7ecfb);

  color:#9a7c78;
  font-size:12px;
  font-weight:900;
}

.activity-title{
  margin-bottom:11px;

  color:#745e5a;
  font-size:clamp(28px,4vw,42px);
  font-weight:900;
  line-height:1.45;
}

.activity-desc{
  max-width:520px;

  color:#987e79;
  line-height:1.85;
  font-size:14px;
}
  /* ===== 第四區・我的收藏 精緻奶油手帳版 ===== */

.side-title{
  position:relative;
  margin:0 0 16px;
  color:#765f5b;
  font-size:21px;
  font-weight:900;
}

.side-title::after{
  content:"✦";
  margin-left:8px;
  color:#d4ae6d;
  font-size:11px;
}

/* 收藏清單 */
.favorite-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.favorite-item{
  position:relative;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  padding:13px 14px;

  border:1px solid rgba(233,216,211,.85);
  border-radius:17px;

  background:
    linear-gradient(135deg,#fffdfb,#fff7f4);

  box-shadow:0 5px 13px rgba(103,79,72,.04);

  transition:.18s ease;
}

.favorite-item:hover{
  transform:translateY(-1px);

  box-shadow:
    0 8px 17px rgba(103,79,72,.06);
}

.favorite-text{
  color:#7a6460;
  font-weight:900;
  line-height:1.5;
}

/* 刪除按鈕 */
.remove-btn{
  border:1px solid #efd8dc;
  border-radius:11px;

  padding:7px 10px;

  background:
    linear-gradient(135deg,#fff7f8,#fff0f2);

  color:#b17b84;

  font-family:inherit;
  font-size:12px;
  font-weight:800;

  cursor:pointer;

  transition:.18s;
}

.remove-btn:hover{
  transform:translateY(-1px);
  background:#ffecef;
}

/* 收藏提示 */
.tip{
  position:relative;
  margin-top:18px;

  padding:14px 16px;

  border:1px dashed #ead5c8;
  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      #fff9e9,
      #fff4f5,
      #faf3ff
    );

  color:#8f775f;
  line-height:1.7;
  font-size:13px;
}

.tip::after{
  content:"♡";
  position:absolute;
  right:12px;
  bottom:8px;

  color:#d8a6b0;
  font-size:14px;
  opacity:.55;
}

/* 還沒有收藏時 */
.empty{
  position:relative;
  overflow:hidden;

  padding:34px 12px;

  text-align:center;
  color:#9a807a;

  border:1px dashed #e6d5d0;
  border-radius:20px;

  background:
    radial-gradient(circle at 15% 15%,rgba(255,224,232,.40),transparent 24%),
    radial-gradient(circle at 88% 84%,rgba(234,225,249,.45),transparent 25%),
    linear-gradient(135deg,#fffdfb,#fff8f5);
}

.empty-icon{
  font-size:38px;
  margin-bottom:8px;
}
  /* ===== 第五區・抽活動＋收藏按鈕 精緻版 ===== */

.action-row{
  margin-top:22px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

.draw-btn,
.fav-btn{
  min-height:46px;
  padding:12px 19px;

  border-radius:16px;

  font-family:inherit;
  font-size:14px;
  font-weight:900;

  cursor:pointer;
  transition:.18s ease;
}

/* 幫我抽一個 */
.draw-btn{
  border:1px solid #deb4be;

  background:
    linear-gradient(
      135deg,
      #e5a9b6,
      #d9b7df
    );

  color:#fff;

  box-shadow:
    0 7px 17px rgba(198,151,174,.20);
}

.draw-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 21px rgba(198,151,174,.25);
}

/* 收藏這個 */
.fav-btn{
  border:1px solid #ead9a9;

  background:
    linear-gradient(
      135deg,
      #fff8db,
      #fff0d4
    );

  color:#94764d;

  box-shadow:
    0 6px 15px rgba(180,150,95,.10);
}

.fav-btn:hover{
  transform:translateY(-2px);

  background:
    linear-gradient(
      135deg,
      #fff5cd,
      #ffe9d0
    );
}


/* ===== 修正 iPhone Hero 圖片被隱藏 ===== */

@media(max-width:520px){

  .hero-art{
    display:block;
    width:100%;
    min-width:0;
  }

  .activities-hero-image{
    display:block;
    width:260px;
    max-width:100%;
    margin:0 auto;
  }

}
  /* ===== 第六區・Panel 外框＋Footer 收尾 ===== */

.main-grid{
  margin-top:22px;
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:20px;
  align-items:start;
}

.panel{
  position:relative;
  overflow:hidden;

  padding:24px;

  border:1px solid rgba(231,211,205,.80);

  background:
    linear-gradient(
      145deg,

    );

  box-shadow:
    0 12px 30px rgba(103,79,72,.07);
}

.panel::before{
  content:"";
  position:absolute;

  width:110px;
  height:110px;

  right:-42px;
  top:-45px;

  border-radius:50%;
  background:rgba(248,218,226,.22);

  pointer-events:none;
}

.panel > *{
  position:relative;
  z-index:1;

/* Footer */
.footer{
  position:relative;

  width:max-content;
  max-width:100%;

  margin:30px auto 0;
  padding:12px 24px;

  text-align:center;

  color:#9a7c78;
  font-size:13px;
  font-weight:800;

  border:1px dashed rgba(224,194,190,.75);
  border-radius:999px;

  background:
    linear-gradient(
      135deg,
      rgba(255,248,242,.95),
      rgba(255,241,245,.90),
      rgba(247,241,255,.90)
    );

  box-shadow:
    0 7px 18px rgba(105,82,74,.05);
}

.footer::before{
  content:"✦";
  margin-right:8px;

  color:#d3ad70;
  font-size:11px;
}

.footer::after{
  content:"♡";
  margin-left:8px;

  color:#d7a4ae;
  font-size:12px;
}

/* 手機版 */
@media(max-width:760px){

  .main-grid{
    grid-template-columns:1fr;
  }

  .panel{
    padding:18px;
  }

}

<body>

<header class="topbar">
  <div class="nav">
    <div class="brand">
      <div class="brand-icon">🌸</div>
      <span>今天做什麼</span>
    </div>

    <a class="home-link" href="index.html">← 回首頁</a>
  </div>
</header>

<main class="container">

  <section class="hero">

      </h1>

        按一下，就幫你抽一個可愛又有趣的小活動。
      </p>

      <div class="hero-stickers">
        <span>🎡 幸運抽活動</span>
        <span>🌷 一起玩耍</span>
        <span>♡ 收藏喜歡的點子</span>
      </div>
    </div>

    <div class="hero-art">
  <img
    src="activities-hero.png"
    alt="今天做什麼兔兔插畫"
    class="activities-hero-image"
  >
</div>

  </div>
</section>

  <div class="category-row">
    <button class="category-btn active" onclick="setCategory('all',this)">全部</button>
    <button class="category-btn" onclick="setCategory('indoor',this)">🏠 室內</button>
    <button class="category-btn" onclick="setCategory('outdoor',this)">🌿 戶外</button>
    <button class="category-btn" onclick="setCategory('creative',this)">🎨 創作</button>
    <button class="category-btn" onclick="setCategory('quiet',this)">📚 靜態</button>
  </div>

  <section class="main-grid">

    <div class="panel">
      <div class="draw-card">
        <div id="activityIcon" class="activity-icon">🎁</div>
        <div id="activityCategory" class="activity-category">準備好了嗎？</div>
        <div id="activityTitle" class="activity-title">今天想做什麼？</div>
        <div id="activityDesc" class="activity-desc">
          按下「幫我抽一個」看看今天的小驚喜。
        </div>

        <div class="action-row">
          <button class="draw-btn" onclick="drawActivity()">
            ✨ 幫我抽一個
          </button>

          <button class="fav-btn" onclick="addFavorite()">
            ♡ 收藏這個
          </button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2 class="side-title">🎀 我的收藏</h2>
      <div id="favoriteList" class="favorite-list"></div>

      <div class="tip">
        💡 收藏喜歡的活動，下次不知道做什麼時，就可以直接從這裡挑。
      </div>
    </div>

  </section>

  <div class="footer">
    🌷 小小的陪伴，也可以變成很美好的回憶。
  </div>

</main>

<script>
const FAVORITE_KEY = "parentPlayActivityFavorites";

const activities = [
  {
    id:"a1",
    category:"indoor",
    categoryName:"🏠 室內活動",
    icon:"🧩",
    title:"一起拼拼圖",
    desc:"選一盒喜歡的拼圖，一起慢慢完成。"
  },
  {
    id:"a2",
    category:"indoor",
    categoryName:"🏠 室內活動",
    icon:"🍪",
    title:"一起做小點心",
    desc:"可以做餅乾、三明治或簡單的小甜點。"
  },
  {
    id:"a3",
    category:"outdoor",
    categoryName:"🌿 戶外活動",
    icon:"🚶",
    title:"散步尋寶",
    desc:"出去散步，看看誰先找到三種不同顏色的東西。"
  },
  {
    id:"a4",
    category:"outdoor",
    categoryName:"🌿 戶外活動",
    icon:"🌳",
    title:"公園小冒險",
    desc:"去附近公園走走，玩溜滑梯或一起觀察植物。"
  },
  {
    id:"a5",
    category:"creative",
    categoryName:"🎨 創作活動",
    icon:"🎨",
    title:"畫今天的心情",
    desc:"各畫一張今天的心情，再交換看看彼此畫了什麼。"
  },
  {
    id:"a6",
    category:"creative",
    categoryName:"🎨 創作活動",
    icon:"✂️",
    title:"做一張小卡片",
    desc:"用紙、貼紙或彩色筆做一張小卡片送給家人。"
  },
  {
    id:"a7",
    category:"quiet",
    categoryName:"📚 靜態活動",
    icon:"📖",
    title:"一起讀一本書",
    desc:"挑一本喜歡的故事書，輪流念或一起看圖片。"
  },
  {
    id:"a8",
    category:"quiet",
    categoryName:"📚 靜態活動",
    icon:"🃏",
    title:"玩一局桌遊",
    desc:"選一款簡單桌遊或紙牌遊戲，一起玩一局。"
  },
  {
    id:"a9",
    category:"indoor",
    categoryName:"🏠 室內活動",
    icon:"🎶",
    title:"客廳音樂時間",
    desc:"放喜歡的音樂，一起唱歌或隨音樂自由動一動。"
  },
  {
    id:"a10",
    category:"outdoor",
    categoryName:"🌿 戶外活動",
    icon:"📷",
    title:"拍三張今天的照片",
    desc:"一起找三個喜歡的畫面，留下今天的小紀錄。"
  },
  {
    id:"a11",
    category:"creative",
    categoryName:"🎨 創作活動",
    icon:"🧱",
    title:"積木挑戰",
    desc:"一起用積木蓋一座房子、動物或想像中的城堡。"
  },
  {
    id:"a12",
    category:"quiet",
    categoryName:"📚 靜態活動",
    icon:"💌",
    title:"說三件開心的事",
    desc:"輪流分享今天三件覺得開心或感謝的小事。"
  }
];

let currentCategory = "all";
let currentActivity = null;
let favorites = JSON.parse(localStorage.getItem(FAVORITE_KEY)) || [];

function setCategory(category,button){
  currentCategory = category;

  document.querySelectorAll(".category-btn").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");
}

function drawActivity(){
  const pool = currentCategory === "all"
    ? activities
    : activities.filter(a => a.category === currentCategory);

  if(pool.length === 0) return;

  let next = pool[Math.floor(Math.random() * pool.length)];

  if(pool.length > 1 && currentActivity){
    while(next.id === currentActivity.id){
      next = pool[Math.floor(Math.random() * pool.length)];
    }
  }

  currentActivity = next;

  document.getElementById("activityIcon").textContent = next.icon;
  document.getElementById("activityCategory").textContent = next.categoryName;
  document.getElementById("activityTitle").textContent = next.title;
  document.getElementById("activityDesc").textContent = next.desc;
}

function addFavorite(){
  if(!currentActivity){
    alert("🌷 先抽一個活動再收藏喔");
    return;
  }

  const exists = favorites.some(item => item.id === currentActivity.id);

  if(exists){
    alert("🎀 這個活動已經收藏過囉");
    return;
  }

  favorites.unshift(currentActivity);
  saveFavorites();
  renderFavorites();
}

function removeFavorite(id){
  favorites = favorites.filter(item => item.id !== id);
  saveFavorites();
  renderFavorites();
}

function saveFavorites(){
  localStorage.setItem(FAVORITE_KEY, JSON.stringify(favorites));
}

function renderFavorites(){
  const list = document.getElementById("favoriteList");

  if(favorites.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🌷</div>
        還沒有收藏活動喔。
      </div>
    `;
    return;
  }

  list.innerHTML = favorites.map(item => `
    <div class="favorite-item">
      <div class="favorite-text">
        ${item.icon} ${escapeHtml(item.title)}
      </div>

      <button class="remove-btn"
        onclick="removeFavorite('${item.id}')">
        刪除
      </button>
    </div>
  `).join("");
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

renderFavorites();
</script>

</body>
</html>
