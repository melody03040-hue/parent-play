<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>親子心情卡｜親子遊戲小站</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:
    linear-gradient(180deg,#fff9f7 0%,#fffdfb 100%);
  color:#705b58;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 22px;
  background:rgba(255,250,248,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #f1e4df;
}

.brand{
  font-size:18px;
  font-weight:900;
}

.home-link{
  text-decoration:none;
  color:#8f7270;
  font-weight:800;
}

.wrap{
  width:min(920px,92%);
  margin:32px auto 60px;
}

.hero{
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:36px 22px;
  border-radius:32px;
  background:
    linear-gradient(135deg,#fde7ec,#fff3dc,#eee7fa);
  box-shadow:0 14px 34px rgba(124,88,82,.08);
}

.hero::before{
  content:"💗";
  position:absolute;
  left:7%;
  top:17%;
  font-size:26px;
  opacity:.65;
}

.hero::after{
  content:"🌷";
  position:absolute;
  right:7%;
  bottom:12%;
  font-size:30px;
  opacity:.75;
}

.hero h1{
  margin:0;
  font-size:34px;
  color:#7f6460;
}

.hero p{
  margin:12px auto 0;
  max-width:590px;
  line-height:1.8;
  color:#947875;
}

.panel{
  margin-top:24px;
  padding:26px;
  border-radius:28px;
  background:#fff;
  border:1px solid #f3e8e3;
  box-shadow:0 14px 32px rgba(116,86,80,.08);
}

.section-title{
  margin:0 0 18px;
  font-size:20px;
  font-weight:900;
}

.person-tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.person-btn{
  flex:1;
  border:none;
  cursor:pointer;
  padding:13px 10px;
  border-radius:16px;
  font-weight:900;
  font-size:15px;
  color:#866b68;
  background:#fff5f2;
  border:1px solid #f0ded8;
}

.person-btn.active{
  background:linear-gradient(135deg,#f5c4cd,#e1d2f3);
  color:#fff;
  border-color:transparent;
}

.mood-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.mood-btn{
  border:none;
  cursor:pointer;
  min-height:96px;
  border-radius:20px;
  background:#fff8f4;
  border:1px solid #f1e2db;
  transition:.18s;
  color:#806a66;
}

.mood-btn:hover{
  transform:translateY(-2px);
}

.mood-btn.active{
  background:
    linear-gradient(135deg,#ffe4e8,#fff0d9,#eee7fa);
  border:2px solid #e6b7c1;
  box-shadow:0 7px 16px rgba(201,153,169,.18);
}

.mood-emoji{
  display:block;
  font-size:34px;
  margin-bottom:5px;
}

.mood-name{
  font-size:14px;
  font-weight:900;
}

.field{
  margin-top:18px;
}

.field label{
  display:block;
  margin-bottom:8px;
  font-size:14px;
  font-weight:900;
  color:#8c716e;
}

textarea,
input{
  width:100%;
  border:none;
  outline:none;
  border-radius:18px;
  padding:15px 16px;
  font-size:16px;
  background:#fff7f5;
  border:1px solid #f0ded8;
  color:#705b58;
  font-family:inherit;
}

textarea{
  min-height:110px;
  resize:vertical;
  line-height:1.7;
}

.save-btn{
  width:100%;
  margin-top:20px;
  border:none;
  cursor:pointer;
  border-radius:18px;
  padding:15px 20px;
  font-size:17px;
  font-weight:900;
  color:white;
  background:
    linear-gradient(135deg,#e8a8b5,#cbb7e8);
  box-shadow:0 8px 18px rgba(209,160,179,.25);
}

.save-btn:hover{
  transform:translateY(-1px);
}

.summary{
  margin-top:22px;
  padding:18px;
  text-align:center;
  border-radius:22px;
  background:
    linear-gradient(135deg,#fff1f4,#fff8e8,#f2ecfb);
  border:1px dashed #e7cac8;
}

.summary-icon{
  font-size:38px;
}

.summary-title{
  margin-top:5px;
  font-weight:900;
  font-size:18px;
}

.summary-text{
  margin-top:6px;
  color:#987d79;
  line-height:1.7;
}

.history{
  display:grid;
  gap:14px;
}

.history-card{
  padding:18px;
  border-radius:20px;
  background:#fff9f6;
  border:1px solid #f1e4dd;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
}

.history-mood{
  font-size:28px;
}

.history-info{
  flex:1;
}

.history-person{
  font-weight:900;
  color:#826967;
}

.history-date{
  margin-top:3px;
  font-size:12px;
  color:#b09893;
}

.history-message{
  margin-top:12px;
  line-height:1.7;
  color:#806966;
  white-space:pre-wrap;
}

.delete-btn{
  border:none;
  cursor:pointer;
  background:#f9e9e6;
  color:#a77d78;
  border-radius:12px;
  padding:7px 10px;
  font-weight:800;
}

.empty{
  text-align:center;
  padding:22px 10px;
  color:#ad9490;
}

.clear-btn{
  margin-top:16px;
  border:none;
  cursor:pointer;
  border-radius:14px;
  padding:10px 15px;
  background:#f8eae7;
  color:#9d7772;
  font-weight:900;
}

@media(max-width:650px){
  .hero h1{
    font-size:28px;
  }

  .mood-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .mood-btn:last-child{
    grid-column:1 / -1;
  }

  .history-top{
    align-items:center;
  }
}
 /* ===== 親子心情卡 Hero・精緻奶油手帳版 ===== */

.hero{
  position:relative;
  overflow:hidden;

  padding:38px 42px;
  border-radius:34px;

  background:
    radial-gradient(circle at 12% 18%,rgba(255,220,228,.55),transparent 24%),
    radial-gradient(circle at 88% 80%,rgba(231,220,249,.58),transparent 26%),
    linear-gradient(135deg,#fffaf7,#fff1ed,#f7effc);
}

.hero::before{
  content:"";
  position:absolute;

  width:170px;
  height:170px;

  left:-55px;
  bottom:-75px;

  border-radius:50%;
  background:rgba(255,255,255,.45);
}

.hero::after{
  content:"✦  💗  ♡";
  position:absolute;

  right:30px;
  top:18px;

  color:#d4a96c;
  font-size:14px;
  letter-spacing:7px;
  opacity:.6;
}

.hero-inner{
  position:relative;
  z-index:2;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:30px;
}

.hero-copy{
  flex:1;
}

.hero-kicker{
  margin-bottom:8px;

  color:#c69aa2;

  font-size:11px;
  font-weight:900;
  letter-spacing:2.5px;
}

.hero h1{
  margin:0;

  color:#765d5a;

  font-size:34px;
  line-height:1.45;
}

.hero-highlight{
  position:relative;
  display:inline-block;

  margin-left:5px;
  padding:0 9px 3px;

  color:#8a6664;

  z-index:1;
}

.hero-highlight::before{
  content:"";

  position:absolute;

  left:0;
  right:0;
  bottom:2px;

  height:52%;

  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      #f9dfe5,
      #fff0d4,
      #eee5fa
    );

  transform:rotate(-1deg);

  z-index:-1;
}

.hero p{
  margin:12px 0 0;

  color:#957975;
  line-height:1.8;
}

.hero-stickers{
  display:flex;
  flex-wrap:wrap;

  gap:8px;

  margin-top:18px;
}

.hero-stickers span{
  padding:7px 12px;

  border-radius:999px;

  background:rgba(255,255,255,.72);

  border:1px solid rgba(224,196,192,.55);

  color:#8d7470;

  font-size:12px;
  font-weight:800;

  box-shadow:
    0 4px 10px rgba(112,83,78,.05);
}

.hero-art{
  flex:0 0 auto;

  min-width:190px;

  text-align:center;

  font-size:72px;

  filter:
    drop-shadow(0 10px 12px rgba(114,85,80,.10));
}

@media(max-width:650px){

  .hero{
    padding:30px 22px;
  }

  .hero-inner{
    flex-direction:column;
    text-align:center;
  }

  .hero h1{
    font-size:28px;
  }

  .hero-stickers{
    justify-content:center;
  }

  .hero-art{
    font-size:64px;
  }

}
/* ===== 親子心情卡 Hero 圖片 ===== */

.mood-hero-image{
  display:block;
  width:320px;
  max-width:100%;
  height:auto;
  object-fit:contain;
  border-radius:24px;

  filter:
    drop-shadow(0 12px 18px rgba(112,83,78,.10));
}

@media(max-width:650px){

  .mood-hero-image{
    width:280px;
  }

}

/* iPhone 小螢幕也保留 Hero 圖片 */
@media(max-width:520px){

  .hero-art{
    display:block;
    width:100%;
    min-width:0;
  }

  .mood-hero-image{
    display:block;
    width:260px;
    max-width:100%;
    margin:0 auto;
  }

}
/* ===== 心情選擇區・精緻奶油手帳版 ===== */

.panel{
  position:relative;
  overflow:hidden;

  margin-top:22px;
  padding:26px;

  border:1px solid rgba(232,214,208,.82);
  border-radius:29px;

  background:
    radial-gradient(circle at 95% 5%,rgba(244,221,233,.30),transparent 21%),
    linear-gradient(145deg,#fffefd,#fff9f7);

  box-shadow:
    0 11px 28px rgba(108,82,75,.065);
}

.panel::before{
  content:"♡";
  position:absolute;
  right:22px;
  top:17px;

  color:#e1b5bd;
  font-size:17px;
  opacity:.48;
}

.section-title{
  position:relative;
  z-index:1;

  margin:0 0 16px;

  color:#765f5b;
  font-size:19px;
  font-weight:900;
}

/* 第二個標題留一點距離 */
.mood-grid + .section-title,
.person-tabs + .section-title{
  margin-top:25px;
}

/* ===== 孩子 / 家長 ===== */

.person-tabs{
  display:flex;
  gap:10px;
  margin-bottom:26px;
}

.person-btn{
  flex:1;

  min-height:48px;
  padding:11px 18px;

  border:1px solid #eadbd6;
  border-radius:16px;

  background:#fffaf8;
  color:#947a75;

  font-family:inherit;
  font-size:14px;
  font-weight:900;

  box-shadow:
    0 4px 10px rgba(108,82,75,.04);

  transition:.18s ease;
}

.person-btn:hover{
  transform:translateY(-1px);
}

/* 被選中的身份 */
.person-btn.active{
  border-color:#e4b6c0;

  background:
    linear-gradient(135deg,#f9dce3,#f4e5f6);

  color:#805f66;

  box-shadow:
    0 6px 15px rgba(199,151,174,.15);
}

/* ===== 五張心情卡 ===== */

.mood-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:11px;
}

.mood-btn{
  position:relative;

  min-height:105px;
  padding:15px 8px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:7px;

  border:1px solid #eaded9;
  border-radius:21px;

  background:
    linear-gradient(145deg,#fffefd,#fff8f6);

  color:#806a66;

  font-family:inherit;

  box-shadow:
    0 6px 14px rgba(108,82,75,.045);

  transition:.18s ease;
}

.mood-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 9px 18px rgba(108,82,75,.07);
}

.mood-emoji{
  font-size:32px;
  line-height:1;
}

.mood-name{
  font-size:13px;
  font-weight:900;
}

/* 選中的心情卡 */
.mood-btn.active{
  border-color:#e3b3be;

  background:
    radial-gradient(circle at 50% 10%,rgba(255,255,255,.72),transparent 35%),
    linear-gradient(145deg,#fbe0e6,#f5e7f7);

  color:#795d63;

  box-shadow:
    0 8px 18px rgba(199,151,174,.16);
}

.mood-btn.active::after{
  content:"♡";

  position:absolute;
  right:9px;
  top:7px;

  color:#c98f9c;
  font-size:12px;
}

/* ===== 手機 ===== */

@media(max-width:650px){

  .panel{
    padding:20px;
  }

  .mood-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .mood-btn{
    min-height:94px;
  }

  /* 第五張置中 */
  .mood-btn:last-child{
    grid-column:1 / -1;
  }

}

@media(max-width:420px){

  .person-tabs{
    gap:8px;
  }

  .person-btn{
    padding:10px 8px;
  }

}
/* ===== 想說的話＋儲存心情・精緻奶油手帳版 ===== */

/* 心情留言框 */
textarea{
  display:block;
  width:100%;
  min-height:125px;

  padding:15px 17px;

  border:1px solid #eadbd6;
  border-radius:18px;

  outline:none;
  resize:vertical;

  background:
    linear-gradient(145deg,#fffdfc,#fff8f6);

  color:#765f5b;

  font-family:inherit;
  font-size:14px;
  line-height:1.8;

  box-shadow:
    inset 0 2px 6px rgba(108,82,75,.025);

  transition:.18s ease;
}

textarea::placeholder{
  color:#b39b96;
}

textarea:focus{
  border-color:#e2b2bd;

  background:#fff;

  box-shadow:
    0 0 0 4px rgba(238,190,201,.13);
}

/* 儲存今天心情 */
.save-btn{
  display:block;

  width:min(320px,100%);
  min-height:50px;

  margin:20px auto 0;
  padding:14px 24px;

  border:1px solid #dcb3bd;
  border-radius:17px;

  background:
    linear-gradient(135deg,#e5a8b5,#d7b8df);

  color:#fff;

  font-family:inherit;
  font-size:15px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 8px 18px rgba(199,151,174,.22);

  transition:.18s ease;
}

.save-btn:hover{
  transform:translateY(-1px);

  box-shadow:
    0 11px 22px rgba(199,151,174,.26);
}

.save-btn:active{
  transform:translateY(0);
}

/* 手機 */
@media(max-width:600px){

  textarea{
    min-height:115px;
  }

  .save-btn{
    width:100%;
  }

}
  /* ===== 心情小日記・精緻奶油手帳版 ===== */

.history{
  display:grid;
  gap:13px;
}

/* 每一張心情紀錄卡 */
.history-card{
  position:relative;
  overflow:hidden;

  padding:17px;

  border:1px solid #eadfd9;
  border-radius:20px;

  background:
    radial-gradient(circle at 94% 10%,rgba(246,221,230,.30),transparent 24%),
    linear-gradient(145deg,#fffefd,#fff8f6);

  box-shadow:
    0 6px 15px rgba(108,82,75,.045);
}

/* 小裝飾 */
.history-card::after{
  content:"♡";
  position:absolute;

  right:14px;
  bottom:10px;

  color:#e1b5bd;
  font-size:13px;
  opacity:.45;
}

.history-top{
  position:relative;
  z-index:1;

  display:flex;
  align-items:center;
  gap:12px;
}

/* 心情 Emoji */
.history-mood{
  flex:0 0 auto;

  width:48px;
  height:48px;

  display:grid;
  place-items:center;

  border-radius:16px;

  background:
    linear-gradient(145deg,#fff1f4,#f7ecfb);

  font-size:27px;

  box-shadow:
    inset 0 0 0 1px rgba(230,205,211,.55);
}

.history-info{
  flex:1;
  min-width:0;
}

.history-person{
  color:#785f5c;

  font-size:14px;
  font-weight:900;
}

.history-date{
  margin-top:4px;

  color:#aa918c;

  font-size:11px;
}

/* 留言內容 */
.history-message{
  position:relative;
  z-index:1;

  margin-top:13px;
  padding:12px 14px;

  border:1px solid #eee1dc;
  border-radius:15px;

  background:rgba(255,250,247,.85);

  color:#806966;

  font-size:13px;
  line-height:1.8;

  white-space:pre-wrap;
}

/* 單筆刪除 */
.delete-btn{
  flex:0 0 auto;

  padding:7px 11px;

  border:1px solid #ead3d0;
  border-radius:12px;

  background:#f9ebe8;

  color:#9f7672;

  font-family:inherit;
  font-size:11px;
  font-weight:900;

  cursor:pointer;

  transition:.18s ease;
}

.delete-btn:hover{
  transform:translateY(-1px);

  background:#f6dfdc;
}

/* 沒有紀錄時 */
.empty{
  padding:24px 16px;

  border:1px dashed #e6d5d1;
  border-radius:18px;

  background:
    linear-gradient(145deg,#fffdfb,#fff8f6);

  color:#a28a85;

  text-align:center;
  font-size:13px;
  line-height:1.8;
}

/* 清除全部紀錄 */
.clear-btn{
  display:block;

  margin:17px auto 0;
  padding:10px 16px;

  border:1px solid #ead3d0;
  border-radius:14px;

  background:
    linear-gradient(135deg,#f9ece9,#f2e8f1);

  color:#97746f;

  font-family:inherit;
  font-size:12px;
  font-weight:900;

  cursor:pointer;
}

/* 手機 */
@media(max-width:600px){

  .history-card{
    padding:15px;
  }

  .history-top{
    align-items:flex-start;
  }

  .history-mood{
    width:44px;
    height:44px;
    font-size:25px;
  }

  .delete-btn{
    padding:6px 9px;
  }

  .clear-btn{
    width:100%;
  }

}
/* ===== 今日心情摘要卡・精緻奶油手帳版 ===== */

.summary{
  position:relative;
  overflow:hidden;

  margin-top:22px;
  padding:20px 18px;

  text-align:center;

  border:1px dashed #e4c8cb;
  border-radius:22px;

  background:
    radial-gradient(circle at 15% 20%,rgba(255,225,233,.38),transparent 24%),

  box-shadow:
    0 7px 17px rgba(108,82,75,.05);
}

.summary::before{
  content:"✦";
  position:absolute;

  left:17px;
  top:12px;

  color:#d2aa69;
  font-size:12px;
  opacity:.52;
}

.summary::after{
  content:"♡";
  position:absolute;

  right:17px;
  bottom:11px;

  color:#d7a5ae;
  font-size:13px;
  opacity:.55;
}

.summary-icon{
  position:relative;
  z-index:1;

  margin-bottom:5px;

  font-size:36px;
  line-height:1.2;
}

.summary-title{
  position:relative;
  z-index:1;

  margin-top:4px;

  color:#765f5b;

  font-size:17px;
  font-weight:900;
}

.summary-text{
  position:relative;
  z-index:1;

  margin-top:6px;

  color:#967d78;

  font-size:13px;
  line-height:1.75;
}

@media(max-width:600px){

  .summary{
    padding:18px 15px;
  }

  .summary-icon{
    font-size:33px;
  }

  .summary-title{
    font-size:16px;
  }

}  
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">🐰 親子心情卡</div>
  <a href="index.html" class="home-link">← 回首頁</a>
</header>

<main class="wrap">

  <section class="hero">
  <div class="hero-inner">

    <div class="hero-copy">
      <div class="hero-kicker">OUR LITTLE MOOD CARD</div>

      <h1>
        把今天的心情
        <span class="hero-highlight">好好說出來</span>
      </h1>

      <p>
        開心、難過、生氣或緊張都可以說。<br>
        把每天的小心情，慢慢收藏成溫柔的回憶。
      </p>

      <div class="hero-stickers">
        <span>💗 說說今天心情</span>
        <span>🌷 好好被聽見</span>
        <span>🎀 收藏小回憶</span>
      </div>
    </div>

    <div class="hero-art">
  <img
    src="mood-hero.png"
    alt="親子心情卡兔兔插畫"
    class="mood-hero-image"
  >
</div>

  </div>
</section>

  <section class="panel">

    <h2 class="section-title">🌷 今天是誰的心情？</h2>

    <div class="person-tabs">

      <button
        class="person-btn active"
        data-person="孩子"
        onclick="selectPerson(this)">
        🐰 孩子
      </button>

      <button
        class="person-btn"
        data-person="家長"
        onclick="selectPerson(this)">
        🌼 家長
      </button>

    </div>

    <h2 class="section-title">💗 選一張心情卡</h2>

    <div class="mood-grid">

      <button
        class="mood-btn"
        data-mood="開心"
        data-emoji="😊"
        onclick="selectMood(this)">
        <span class="mood-emoji">😊</span>
        <span class="mood-name">開心</span>
      </button>

      <button
        class="mood-btn"
        data-mood="平靜"
        data-emoji="😌"
        onclick="selectMood(this)">
        <span class="mood-emoji">😌</span>
        <span class="mood-name">平靜</span>
      </button>

      <button
        class="mood-btn"
        data-mood="難過"
        data-emoji="😢"
        onclick="selectMood(this)">
        <span class="mood-emoji">😢</span>
        <span class="mood-name">難過</span>
      </button>

      <button
        class="mood-btn"
        data-mood="生氣"
        data-emoji="😠"
        onclick="selectMood(this)">
        <span class="mood-emoji">😠</span>
        <span class="mood-name">生氣</span>
      </button>

      <button
        class="mood-btn"
        data-mood="緊張"
        data-emoji="😣"
        onclick="selectMood(this)">
        <span class="mood-emoji">😣</span>
        <span class="mood-name">緊張</span>
      </button>

    </div>

    <div class="field">
      <label for="message">💌 今天想說的話</label>

      <textarea
        id="message"
        maxlength="300"
        placeholder="例如：今天在學校和朋友一起玩，我覺得很開心。">
      </textarea>
    </div>

    <button class="save-btn" onclick="saveMood()">
      🎀 保存今天的心情
    </button>

    <div id="summary" class="summary">

      <div class="summary-icon">💗</div>

      <div class="summary-title">
        今天的心情還沒選擇
      </div>

      <div class="summary-text">
        選一張最接近現在感受的心情卡吧。
      </div>

    </div>

  </section>

  <section class="panel">

    <h2 class="section-title">📖 我們的心情小日記</h2>

    <div id="history" class="history"></div>

    <button class="clear-btn" onclick="clearAll()">
      清除全部紀錄
    </button>

  </section>

</main>

<script>
const MOOD_KEY = "parentPlayMoodRecords";

let selectedPerson = "孩子";
let selectedMood = "";
let selectedEmoji = "";

function selectPerson(button){

  document.querySelectorAll(".person-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  selectedPerson = button.dataset.person;
}

function selectMood(button){

  document.querySelectorAll(".mood-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  selectedMood = button.dataset.mood;
  selectedEmoji = button.dataset.emoji;

  updateSummary();
}

function updateSummary(){

  const summary = document.getElementById("summary");

  if(!selectedMood){

    summary.innerHTML = `
      <div class="summary-icon">💗</div>

      <div class="summary-title">
        今天的心情還沒選擇
      </div>

      <div class="summary-text">
        選一張最接近現在感受的心情卡吧。
      </div>
    `;

    return;
  }

  summary.innerHTML = `
    <div class="summary-icon">
      ${selectedEmoji}
    </div>

    <div class="summary-title">
      ${selectedPerson}今天覺得「${selectedMood}」
    </div>

    <div class="summary-text">
      謝謝你願意說出自己的感受 💗
    </div>
  `;
}

function getRecords(){

  const data = JSON.parse(
    localStorage.getItem(MOOD_KEY)
  );

  return Array.isArray(data) ? data : [];
}

function saveMood(){

  if(!selectedMood){

    alert("請先選一張心情卡 🌷");

    return;
  }

  const message =
    document.getElementById("message")
      .value
      .trim();

  const records = getRecords();

  records.unshift({
    id:Date.now(),
    person:selectedPerson,
    mood:selectedMood,
    emoji:selectedEmoji,
    message:message,
    date:new Date().toLocaleString("zh-TW")
  });

  localStorage.setItem(
    MOOD_KEY,
    JSON.stringify(records)
  );

  document.getElementById("message").value = "";

  document.querySelectorAll(".mood-btn")
    .forEach(btn => btn.classList.remove("active"));

  selectedMood = "";
  selectedEmoji = "";

  updateSummary();
  renderHistory();

  alert("💗 今天的心情已經保存！");
}

function renderHistory(){

  const records = getRecords();

  const box =
    document.getElementById("history");

  if(records.length === 0){

    box.innerHTML = `
      <div class="empty">
        還沒有心情紀錄 🌼<br>
        今天可以先留下第一張心情卡。
      </div>
    `;

    return;
  }

  box.innerHTML =
    records.map(record => `

      <div class="history-card">

        <div class="history-top">

          <div class="history-mood">
            ${escapeHtml(record.emoji)}
          </div>

          <div class="history-info">

            <div class="history-person">
              ${escapeHtml(record.person)}
              ・
              ${escapeHtml(record.mood)}
            </div>

            <div class="history-date">
              ${escapeHtml(record.date)}
            </div>

          </div>

          <button
            class="delete-btn"
            onclick="deleteRecord(${record.id})">
            刪除
          </button>

        </div>

        ${
          record.message
          ? `
            <div class="history-message">
              💌 ${escapeHtml(record.message)}
            </div>
          `
          : ""
        }

      </div>

    `).join("");
}

function deleteRecord(id){

  const records =
    getRecords().filter(
      record => record.id !== id
    );

  localStorage.setItem(
    MOOD_KEY,
    JSON.stringify(records)
  );

  renderHistory();
}

function clearAll(){

  const records = getRecords();

  if(records.length === 0){
    return;
  }

  if(
    confirm(
      "確定要清除全部心情紀錄嗎？"
    )
  ){

    localStorage.removeItem(MOOD_KEY);

    renderHistory();
  }
}

function escapeHtml(text){

  return String(text ?? "")

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

renderHistory();
</script>

</body>
</html>
