<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>獎勵兌換所｜親子遊戲小站</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --ink:#665753;
  --soft:#97857f;
  --line:#eaded9;
  --paper:#fffdfb;
  --pink:#f9dfe6;
  --yellow:#fff0c6;
  --purple:#eee8fb;
  --shadow:0 14px 38px rgba(105,82,74,.10);
}

body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 10% 10%, #fff0f3 0 10%, transparent 30%),
    radial-gradient(circle at 90% 20%, #f1edff 0 10%, transparent 30%),
    #fffaf7;
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,250,247,.9);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}

.nav{
  width:min(1080px,calc(100% - 28px));
  margin:auto;
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900;
}

.brand-icon{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  background:white;
  border-radius:15px;
  border:1px solid var(--line);
  box-shadow:0 5px 16px rgba(100,80,70,.08);
  font-size:22px;
}

.home-link{
  text-decoration:none;
  color:#806f69;
  font-weight:800;
  font-size:14px;
  background:white;
  border:1px solid var(--line);
  padding:9px 14px;
  border-radius:999px;
}

.container{
  width:min(1080px,calc(100% - 28px));
  margin:auto;
  padding:30px 0 50px;
}

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:34px;
  padding:32px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.96),rgba(255,248,239,.94));
  box-shadow:var(--shadow);
}

.hero:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  right:-75px;
  bottom:-95px;
  border-radius:50%;
  background:#fff0c6;
  opacity:.75;
}

.hero-inner{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.hero h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
}

.hero p{
  margin:10px 0 0;
  color:var(--soft);
  line-height:1.8;
}

.hero-art{
  font-size:76px;
}

.star-card{
  margin-top:18px;
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 22px rgba(100,80,70,.06);
  text-align:center;
}

.star-card strong{
  display:block;
  font-size:34px;
  margin-bottom:5px;
}

.star-card span{
  color:var(--soft);
  font-size:13px;
}

.main-grid{
  margin-top:18px;
  display:grid;
  grid-template-columns:.8fr 1.2fr;
  gap:18px;
}

.panel{
  background:rgba(255,255,255,.93);
  border:1px solid var(--line);
  border-radius:28px;
  padding:24px;
  box-shadow:var(--shadow);
}

.panel h2{
  margin:0 0 16px;
  font-size:22px;
}

.field{
  margin-bottom:14px;
}

.label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
  color:#806f69;
}

.input{
  width:100%;
  border:1px solid #e8dad5;
  background:#fffdfc;
  border-radius:16px;
  padding:13px 14px;
  font-size:15px;
  outline:none;
  color:var(--ink);
}

.input:focus{
  border-color:#d9b9b4;
  box-shadow:0 0 0 3px rgba(219,178,177,.13);
}

.add-btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:13px 16px;
  font-size:15px;
  font-weight:900;
  background:#806d68;
  color:white;
  cursor:pointer;
}

.tip{
  margin-top:16px;
  border-radius:18px;
  padding:14px;
  background:#fff7e9;
  color:#8e765f;
  font-size:13px;
  line-height:1.7;
}

.reward-list{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.reward{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:12px;
  border:1px solid #ebdfdb;
  background:#fffdfc;
  border-radius:19px;
  padding:15px;
}

.reward-title{
  font-weight:900;
  line-height:1.5;
}

.reward-cost{
  margin-top:4px;
  font-size:13px;
  color:#a08f89;
}

.reward-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.icon-btn{
  border:0;
  background:#f7ebe7;
  color:#816e68;
  border-radius:12px;
  padding:8px 10px;
  cursor:pointer;
  font-size:13px;
}

.redeem-btn{
  background:#fff0c6;
}

.empty{
  text-align:center;
  padding:42px 12px;
  color:#a08f89;
  border:1px dashed #e7d9d4;
  border-radius:20px;
}

.empty-icon{
  font-size:42px;
  margin-bottom:8px;
}

.history{
  margin-top:18px;
}

.history-item{
  border:1px solid #eee1dc;
  border-radius:16px;
  padding:11px 13px;
  background:#fffaf8;
  font-size:13px;
  color:#8f7e78;
  margin-bottom:8px;
}

.footer{
  text-align:center;
  color:#a08f89;
  font-size:13px;
  padding:28px 0 8px;
}

@media(max-width:760px){
  .main-grid{
    grid-template-columns:1fr;
  }

  .hero-art{
    font-size:58px;
  }
}

@media(max-width:520px){
  .container{
    width:calc(100% - 16px);
    padding-top:16px;
  }

  .hero{
    padding:23px 19px;
    border-radius:26px;
  }

  .hero-art{
    display:none;
  }

  .panel{
    padding:18px;
    border-radius:24px;
  }

  .reward{
    grid-template-columns:1fr;
  }

  .reward-actions{
    justify-content:flex-start;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="nav">
    <div class="brand">
      <div class="brand-icon">🎁</div>
      <span>獎勵兌換所</span>
    </div>

    <a class="home-link" href="index.html">← 回首頁</a>
  </div>
</header>

<main class="container">

  <section class="hero">
    <div class="hero-inner">
      <div>
        <h1>🎁 小小獎勵兌換所</h1>
        <p>
          把每天努力累積的小星星，<br>
          兌換成自己喜歡的小獎勵。
        </p>
      </div>

      <div class="hero-art">🐰⭐🎁</div>
    </div>
  </section>

  <div class="star-card">
    <strong id="starCount">0 ⭐</strong>
    <span>目前可使用星星</span>
  </div>

  <section class="main-grid">

    <div class="panel">

      <h2>🌷 新增獎勵</h2>

      <div class="field">
        <label class="label">獎勵名稱</label>
        <input
          id="rewardName"
          class="input"
          type="text"
          maxlength="40"
          placeholder="例如：看卡通 20 分鐘"
        >
      </div>

      <div class="field">
        <label class="label">需要星星數</label>
        <input
          id="rewardCost"
          class="input"
          type="number"
          min="1"
          max="999"
          placeholder="例如：5"
        >
      </div>

      <button class="add-btn" onclick="addReward()">
        ＋ 加入獎勵清單
      </button>

      <div class="tip">
        💡 兌換成功後，星星會自動扣除，
        並和「兒童任務表」同步更新。
      </div>

    </div>

    <div class="panel">

      <h2>🎀 我的獎勵清單</h2>

      <div id="rewardList" class="reward-list"></div>

      <div class="history">
        <h2 style="margin-top:24px;">✨ 兌換紀錄</h2>
        <div id="historyList"></div>
      </div>

    </div>

  </section>

  <div class="footer">
    🌸 每一顆星星，都是努力留下的小證明。
  </div>

</main>

<script>
const STAR_KEY = "parentPlayStars";
const REWARD_KEY = "parentPlayRewards";
const HISTORY_KEY = "parentPlayRewardHistory";

let totalStars = Number(localStorage.getItem(STAR_KEY)) || 0;
let rewards = JSON.parse(localStorage.getItem(REWARD_KEY)) || [];
let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];

function saveData(){
  localStorage.setItem(STAR_KEY, totalStars);
  localStorage.setItem(REWARD_KEY, JSON.stringify(rewards));
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function addReward(){
  const nameInput = document.getElementById("rewardName");
  const costInput = document.getElementById("rewardCost");

  const name = nameInput.value.trim();
  const cost = Number(costInput.value);

  if(!name){
    alert("🌷 請先輸入獎勵名稱");
    return;
  }

  if(!cost || cost < 1){
    alert("⭐ 請輸入正確的星星數");
    return;
  }

  rewards.push({
    id: Date.now(),
    name,
    cost
  });

  nameInput.value = "";
  costInput.value = "";

  saveData();
  renderAll();
}

function redeemReward(id){
  const reward = rewards.find(r => r.id === id);

  if(!reward) return;

  if(totalStars < reward.cost){
    alert(
      "⭐ 星星還不夠喔！\n目前有 " +
      totalStars +
      " 顆，需要 " +
      reward.cost +
      " 顆。"
    );
    return;
  }

  const ok = confirm(
    "🎁 要兌換「" +
    reward.name +
    "」嗎？\n將扣除 " +
    reward.cost +
    " 顆星星。"
  );

  if(!ok) return;

  totalStars -= reward.cost;

  history.unshift({
    id: Date.now(),
    name: reward.name,
    cost: reward.cost,
    time: new Date().toLocaleString("zh-TW")
  });

  saveData();
  renderAll();

  alert("🎉 兌換成功！");
}

function editReward(id){
  const reward = rewards.find(r => r.id === id);

  if(!reward) return;

  const newName = prompt("修改獎勵名稱", reward.name);

  if(newName === null) return;

  const cleanName = newName.trim();

  if(!cleanName) return;

  const newCost = prompt("修改需要星星數", reward.cost);

  if(newCost === null) return;

  const cleanCost = Number(newCost);

  if(!cleanCost || cleanCost < 1){
    alert("⭐ 星星數必須大於 0");
    return;
  }

  reward.name = cleanName;
  reward.cost = cleanCost;

  saveData();
  renderAll();
}

function deleteReward(id){
  const ok = confirm("確定要刪除這個獎勵嗎？");

  if(!ok) return;

  rewards = rewards.filter(r => r.id !== id);

  saveData();
  renderAll();
}

function renderRewards(){
  const list = document.getElementById("rewardList");

  if(rewards.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🎁</div>
        還沒有設定獎勵喔！<br>
        先新增第一個想兌換的小獎勵吧。
      </div>
    `;
    return;
  }

  list.innerHTML = rewards.map(reward => `
    <div class="reward">

      <div>
        <div class="reward-title">
          ${escapeHtml(reward.name)}
        </div>

        <div class="reward-cost">
          需要 ${reward.cost} ⭐
        </div>
      </div>

      <div class="reward-actions">

        <button
          class="icon-btn redeem-btn"
          onclick="redeemReward(${reward.id})"
        >
          兌換
        </button>

        <button
          class="icon-btn"
          onclick="editReward(${reward.id})"
        >
          修改
        </button>

        <button
          class="icon-btn"
          onclick="deleteReward(${reward.id})"
        >
          刪除
        </button>

      </div>

    </div>
  `).join("");
}

function renderHistory(){
  const list = document.getElementById("historyList");

  if(history.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">✨</div>
        還沒有兌換紀錄喔。
      </div>
    `;
    return;
  }

  list.innerHTML = history.slice(0,10).map(item => `
    <div class="history-item">
      🎁 ${escapeHtml(item.name)}
      ・使用 ${item.cost} ⭐
      <br>
      <small>${escapeHtml(item.time)}</small>
    </div>
  `).join("");
}

function renderStars(){
  document.getElementById("starCount").textContent =
    totalStars + " ⭐";
}

function renderAll(){
  renderStars();
  renderRewards();
  renderHistory();
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

renderAll();
</script>

</body>
</html>
